name: risto-mat-031-haccp-compliance-incident-corrective-action

on:
  push:
    branches:
      - "risto/mat-031-haccp-compliance-incident-corrective-action-20260911"

permissions:
  contents: read

jobs:
  haccp-compliance-incident-corrective-action-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify MAT-031 governed delta
        shell: bash
        run: |
          set -euo pipefail
          base="15b699505b18be5bda1458c4b4159b4d336c07c3"
          git cat-file -e "${base}^{commit}"
          mapfile -t actual < <(git diff --name-only "$base" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            ".github/workflows/risto-mat-031-haccp-compliance-incident-corrective-action.yml" \
            "db/migrations/0040_risto_haccp_compliance_incident_corrective_action.sql" \
            "packages/persistence-postgres/src/risto-haccp-compliance-incident-corrective-action.ts" \
            "packages/ristoairen/src/compliance/haccp-compliance-incident-corrective-action.ts" \
            "tests/postgres/risto-haccp-compliance-incident-corrective-action-runtime.test.ts" | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"

      - name: Install locked Node PostgreSQL dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply AIRenOS bootstrap and canonical migrations through MAT-031
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/bootstrap/0000_runtime_roles.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find db/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{4}_[A-Za-z0-9_.-]+\.sql' | sort)

      - name: Run MAT-014 payment persistence regression
        run: node --experimental-strip-types --test tests/postgres/risto-payment-record-persistence.test.ts
      - name: Run MAT-015 provider-neutral dispatcher regression
        run: node --experimental-strip-types --test tests/integration/risto-outbox-delivery-recovery.test.ts
      - name: Run MAT-016 PostgreSQL outbox worker regression
        run: node --experimental-strip-types --test tests/postgres/risto-outbox-worker-runtime.test.ts
      - name: Run MAT-017 background job engine regression
        run: node --experimental-strip-types --test tests/integration/risto-background-job-engine.test.ts
      - name: Run MAT-017 PostgreSQL scheduled recovery regression
        run: node --experimental-strip-types --test tests/postgres/risto-background-outbox-worker-runtime.test.ts
      - name: Run MAT-018 PostgreSQL webhook replay regression
        run: node --experimental-strip-types --test tests/postgres/risto-webhook-replay-runtime.test.ts
      - name: Run MAT-019 provider capture domain-effect regression
        run: node --experimental-strip-types --test tests/postgres/risto-provider-payment-capture-runtime.test.ts
      - name: Run MAT-022 refund approval regression
        run: node --experimental-strip-types --test tests/postgres/risto-refund-request-runtime.test.ts
      - name: Run MAT-023 refund monetary effect regression
        run: node --experimental-strip-types --test tests/postgres/risto-refund-effect-runtime.test.ts
      - name: Run MAT-024 provider refund saga regression
        run: node --experimental-strip-types --test tests/postgres/risto-provider-refund-saga-runtime.test.ts
      - name: Run MAT-025 Stripe TEST refund adapter regression
        run: node --experimental-strip-types --test tests/integration/risto-stripe-test-refund-adapter.test.ts
      - name: Run MAT-026 menu version/publication regression
        run: node --experimental-strip-types --test tests/postgres/risto-menu-version-publication-runtime.test.ts
      - name: Run MAT-027 inventory receive/stock movement regression
        run: node --experimental-strip-types --test tests/postgres/risto-inventory-receive-stock-movement-runtime.test.ts
      - name: Run MAT-028 inventory transfer atomicity regression
        run: node --experimental-strip-types --test tests/postgres/risto-inventory-transfer-atomicity-runtime.test.ts
      - name: Run MAT-029 procurement PO-backed goods receipt regression
        run: node --experimental-strip-types --test tests/postgres/risto-procurement-po-receipt-runtime.test.ts
      - name: Run MAT-030 workforce attendance/payroll preparation regression
        run: node --experimental-strip-types --test tests/postgres/risto-workforce-attendance-payroll-runtime.test.ts
      - name: Run MAT-031 HACCP/compliance/incident/corrective-action proof
        run: node --experimental-strip-types --test tests/postgres/risto-haccp-compliance-incident-corrective-action-runtime.test.ts
