name: rbl01c-booking-oci-staging

on:
  push:
    branches:
      - "rbl/**"
  workflow_dispatch:

jobs:
  booking-oci-staging-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
      RBL01C_IMAGE_TAG: airenos-foundation-rbl01c:${{ github.sha }}
      MIGRATION_SECRET_MANAGER_ADAPTER: env
      MIGRATION_DATABASE_URL_SECRET_REF: secret://env/RBL01C_MIGRATION_DATABASE_URL
      RBL01C_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply governed Foundation + Booking deploy migrations twice
        run: npm run migrate:rbl01c2-booking && npm run migrate:rbl01c2-booking
      - name: Build exact RBL portable OCI image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t "$RBL01C_IMAGE_TAG" -f deploy/Dockerfile .
      - name: Prove Booking through staging OCI artifact
        run: npm run test:rbl01c-booking-oci-staging
