name: risto-r1-vertical-trust-001-regression

on:
  push:
    branches:
      - "risto/r1-vertical-trust-001-20260917"

permissions:
  contents: read

jobs:
  vertical-trust-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify RISTO-R1-VERTICAL-TRUST-001 exact frozen five-path delta
        shell: bash
        run: |
          set -euo pipefail
          base="0ad9a6af15d3f7ca2e5ca909042dfa96d7daf836"
          git cat-file -e "${base}^{commit}"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$base"

          mapfile -t actual < <(git diff --name-only "$base" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            ".github/workflows/risto-r1-vertical-trust-001-regression.yml" \
            "apps/api/src/risto-vertical-security-context.ts" \
            "apps/api/src/risto-vertical-trusted-context.ts" \
            "tests/integration/risto-vertical-trusted-context.test.ts" \
            "tests/postgres/risto-vertical-domain-adapter-regression.test.ts" | sort)
          test "${#actual[@]}" -eq 5
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"

          test "$(git rev-parse "$GITHUB_SHA:db/migrations/0044_risto_guest_service_order_aggregates.sql")" = "a79a58b7b34d2768c5d5dbd434fd55e653db9579"
          test "$(git rev-parse "$GITHUB_SHA:db/migrations/0046_risto_booking_canonical_authority.sql")" = "a0797fc2117fe6bc5bdedabada997afb56073849"
          test "$(git rev-parse "$GITHUB_SHA:db/migrations/0047_risto_booking_product_neutral_idempotency.sql")" = "02cb5f48fe71f3a709c42903cb3c1a46998ae5bb"
          test "$(git rev-parse "$GITHUB_SHA:db/migrations/0048_risto_booking_authority_reconciliation.sql")" = "c6e6713b4598ff49300f4e0c1586bfc27404886d"
          test "$(git rev-parse "$GITHUB_SHA:db/migrations/0049_risto_c001_public_self_service.sql")" = "1e5e5414ba55517b6cfa8435c97b7d476c7d70e7"
          test "$(git rev-parse "$GITHUB_SHA:apps/api/src/server.ts")" = "$(git rev-parse "$base:apps/api/src/server.ts")"
          test "$(git rev-parse "$GITHUB_SHA:packages/booking-core/src/application-service.ts")" = "$(git rev-parse "$base:packages/booking-core/src/application-service.ts")"
          test "$(git rev-parse "$GITHUB_SHA:apps/api/src/public-booking-api.ts")" = "$(git rev-parse "$base:apps/api/src/public-booking-api.ts")"

      - name: Install locked Node PostgreSQL dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply AIRenOS bootstrap and migrations through C001
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/bootstrap/0000_runtime_roles.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find db/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/00(0[1-9]|[1-3][0-9]|4[0-9])_[A-Za-z0-9_.-]+\.sql' | sort)

      - name: Load Vertical Trust modules
        run: |
          node --experimental-strip-types -e "import('./apps/api/src/risto-vertical-trusted-context.ts')"
          node --experimental-strip-types -e "import('./apps/api/src/risto-vertical-security-context.ts')"

      - name: Run trusted-context cryptographic regression
        run: node --experimental-strip-types --test tests/integration/risto-vertical-trusted-context.test.ts

      - name: Run PostgreSQL domain-adapter regression
        run: node --experimental-strip-types --test tests/postgres/risto-vertical-domain-adapter-regression.test.ts
