name: foundation-contract-ci
on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

jobs:
  application-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:boundaries
      - run: npm run check:machine-context
      - run: npm run check:foundation-contracts
      - run: npm run check:runtime-slice
      - run: npm run check:sql-runtime
      - run: npm run test:foundation-runtime
      - run: npm run test:identity-adapter
      - run: npm run test:runtime-secrets
      - run: npm run test:observability
      - run: npm run test:deployment-contract

  postgres-rls-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked Node PostgreSQL adapter dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute migrations and RLS runtime tests
        run: bash scripts/run-postgres-runtime-tests.sh
      - name: Execute governed persistent command tests
        run: npm run test:governed-command
      - name: Execute authenticated principal runtime tests
        run: npm run test:identity-auth-runtime

  deployment-path-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
    steps:
      - uses: actions/checkout@v4
      - name: Build portable OCI runtime image from locked dependencies
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t "airenos-foundation:${GITHUB_SHA}" -f deploy/Dockerfile .
      - name: Verify deploy, readiness, degraded detection and rollback
        env:
          IMAGE_TAG: airenos-foundation:${{ github.sha }}
          RELEASE_REVISION: ${{ github.sha }}
        run: bash scripts/verify-deployment-runtime.sh
      - name: Upload deployment runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: B44-FX-014-deployment-runtime-evidence
          path: ${{ runner.temp }}/airen-deployment-evidence/B44-FX-014_Deployment_Runtime_Evidence.json
          if-no-files-found: error

  b44-fx-014-code-snapshot:
    needs: [application-contracts, postgres-rls-runtime, deployment-path-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B44-FX-014 closure commit
        uses: actions/checkout@v4
        with:
          ref: 74c1766136fa887a6e3cc6818f2ddff71d049290
          fetch-depth: 0
      - name: Build immutable B44-FX-014 snapshot package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=zip --output=snapshot/AIRenOS-Foundation-B44-FX-014-source.zip 74c1766136fa887a6e3cc6818f2ddff71d049290
          node -e 'const fs=require("fs"); fs.writeFileSync("snapshot/commit-manifest.json", JSON.stringify({milestone:"B44-FX-014",closure_commit:"74c1766136fa887a6e3cc6818f2ddff71d049290",tree_sha:"dcc59068326dac62f2809bbc7e2d33cbed213750",closure_ci:{run_id:32581971279,run_number:257,status:"PASS"},definitive_runtime:{run_id:32581856143,run_number:251,status:"PASS"}},null,2)+"\n")'
          node -e 'const fs=require("fs"),crypto=require("crypto"); const hash=p=>crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); fs.writeFileSync("snapshot/dependency-manifest.json", JSON.stringify({package_json_sha256:hash("package.json"),package_lock_sha256:hash("package-lock.json")},null,2)+"\n")'
          cp machine-context/b44-fx-014-deployment-path.json snapshot/B44-FX-014_Runtime_Evidence.json
          (cd snapshot && sha256sum AIRenOS-Foundation-B44-FX-014-source.zip commit-manifest.json dependency-manifest.json B44-FX-014_Runtime_Evidence.json > SHA256SUMS.txt)
      - name: Upload B44-FX-014 snapshot package
        uses: actions/upload-artifact@v4
        with:
          name: B44-FX-014-code-snapshot
          path: snapshot/*
          if-no-files-found: error
