name: r3-d-exact-closure-archive
on:
  push:
    branches:
      - "archive/r3-d-snapshot-20260822"
  pull_request:
    branches:
      - "foundation/**"

permissions:
  contents: read

jobs:
  package-exact-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified closure commit
        uses: actions/checkout@v4
        with:
          ref: f6792bbfa3ed0b7ef40f047bbce6112cc13066e0
          path: source
          fetch-depth: 1
      - name: Verify exact source state and create deterministic recovery package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f6792bbfa3ed0b7ef40f047bbce6112cc13066e0"
          rm -rf source/.git
          tar --sort=name --mtime='UTC 2026-08-22' --owner=0 --group=0 --numeric-owner -czf AIRenOS_R3-D_f6792bbf_source.tar.gz source
          sha256sum AIRenOS_R3-D_f6792bbf_source.tar.gz > AIRenOS_R3-D_f6792bbf_SHA256SUMS.txt
          printf '%s\n' \
            'milestone=R3-D' \
            'closure_commit=f6792bbfa3ed0b7ef40f047bbce6112cc13066e0' \
            'closure_tree=0cb1e9339590c995bdbe253eb3c39fb7034029f5' \
            'foundation_base=2c40af819c93c32538ccd846b4e9eb7474cd5f74' \
            'r3_c_closure=96c0bb8610b9fb450793112c759dda28a3eb33b1' \
            'exact_closure_ci_run=32592549275' \
            'archive_kind=exact_closure_source_snapshot' \
            > AIRenOS_R3-D_f6792bbf_ARCHIVE_MANIFEST.txt
      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AIRenOS-R3-D-f6792bbf-exact-source-snapshot
          path: |
            AIRenOS_R3-D_f6792bbf_source.tar.gz
            AIRenOS_R3-D_f6792bbf_SHA256SUMS.txt
            AIRenOS_R3-D_f6792bbf_ARCHIVE_MANIFEST.txt
          if-no-files-found: error
