name: AOS R1 Foundation Attachment Ed25519 Contract 159

on:
  push:
    branches:
      - foundation/aos-r1-b44-foundation-attachment-ed25519-contract-159-20260919
  pull_request:
    branches:
      - foundation/aos-r1-b44-foundation-attachment-entrypoint-146-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GATE159_PARENT: be6f34ca9285d829d822322ae03502dba2d80c5c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Verify frozen Gate159 delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${GATE159_PARENT}^{commit}"
          test "$(git merge-base "$GATE159_PARENT" "$GITHUB_SHA")" = "$GATE159_PARENT"
          mapfile -t actual < <(git diff --name-only "$GATE159_PARENT" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            ".github/workflows/aos-r1-foundation-attachment-ed25519-contract-159.yml" \
            "apps/api/src/foundation-attachment-runtime-config.ts" \
            "apps/api/src/foundation-attachment-staging-server.ts" \
            "tests/integration/foundation-attachment-runtime-config.test.ts" | sort)
          test "${#actual[@]}" -eq 4
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          ! git diff "$GATE159_PARENT" "$GITHUB_SHA" --name-only | grep -E '^db/migrations/|session-authority-staging-server|^render\.ya?ml$'
      - run: npm ci
      - name: Gate159 Ed25519-native runtime contract regressions
        run: |
          node --experimental-strip-types --test tests/integration/foundation-attachment-runtime-config.test.ts
          node --experimental-strip-types --test tests/integration/foundation-attachment-runtime-entrypoint.test.ts
          node --experimental-strip-types --test tests/integration/foundation-attachment-runtime-contract.test.ts
          node --experimental-strip-types --test tests/integration/ra01-pilot-registry-publisher.test.ts
      - name: Existing Foundation boundary regression
        run: |
          npm run check:boundaries
          npm run check:foundation-contracts
      - name: Prove legacy HMAC runtime baggage is absent from Attachment startup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'bootstrapFoundationRuntime|loadFoundationRuntimeEnvironment' apps/api/src/foundation-attachment-staging-server.ts
          ! grep -E 'AUTH_PROVIDER_KEY|AUTH_SESSION_KEY_SECRET_REF' apps/api/src/foundation-attachment-runtime-config.ts
          grep -F 'AUTH_ADAPTER must be airenos-session-ed25519' apps/api/src/foundation-attachment-runtime-config.ts
          grep -F 'DATABASE_URL_SECRET_REF' apps/api/src/foundation-attachment-runtime-config.ts
