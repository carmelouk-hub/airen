name: airenpay-connect-source-043-accounts-v2

on:
  push:
    branches:
      - "governance/airenpay-connect-source-043-accounts-v2-20260914"

permissions:
  contents: read

jobs:
  accounts-v2-mock-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify governed Phase 3 scope and concurrent exclusion
        shell: bash
        run: |
          set -euo pipefail
          base="83f85d2755d8ded5d39b8aacdfd20ff0a976ba42"
          mapfile -t actual < <(git diff --name-only "$base" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            ".github/workflows/airenpay-connect-source-043-accounts-v2.yml" \
            "packages/integrations/src/airenpay-stripe-connect-accounts-v2.ts" \
            "tests/integration/airenpay-stripe-connect-accounts-v2.test.ts" | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          ! printf '%s\n' "${actual[@]}" | grep -Fxq "tests/postgres/risto-cross-tenant-isolation-negative-e2e.test.ts"
          ! printf '%s\n' "${actual[@]}" | grep -Fxq ".github/workflows/risto-mat-037-cross-tenant-isolation-negative-e2e.yml"

      - name: Prove adapter has no provider execution primitive or raw credential
        shell: bash
        run: |
          set -euo pipefail
          target="packages/integrations/src/airenpay-stripe-connect-accounts-v2.ts"
          if grep -En 'sk_live_|rk_live_|sk_test_[A-Za-z0-9]+|rk_test_[A-Za-z0-9]+|api\.stripe\.com|fetch\(|https?://' "$target"; then
            echo "Provider execution primitive or raw credential detected" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Run AIRenOS boundary checks
        run: npm run check:boundaries

      - name: Regress provider-neutral Connect contracts
        run: node --experimental-strip-types --test tests/integration/airenpay-connect-contracts.test.ts

      - name: Prove Accounts v2 adapter with injected mocks only
        run: node --experimental-strip-types --test tests/integration/airenpay-stripe-connect-accounts-v2.test.ts

      - name: Regress AIRenPay runtime boundary
        run: node --experimental-strip-types --test tests/integration/airenpay-runtime-boundary.test.ts

      - name: Regress certified Stripe TEST refund adapter without provider call
        run: node --experimental-strip-types --test tests/integration/risto-stripe-test-refund-adapter.test.ts
