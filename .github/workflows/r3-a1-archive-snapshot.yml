name: r3-a1-exact-closure-archive
on:
  push:
    branches:
      - "archive/r3-a1-snapshot-20260822"

permissions:
  contents: read

jobs:
  package-exact-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified closure commit
        uses: actions/checkout@v4
        with:
          ref: bf274805f2e6b0b3bfed4be40f9c03d57725ee64
          path: source
          fetch-depth: 1
      - name: Verify exact source state and create deterministic recovery package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "bf274805f2e6b0b3bfed4be40f9c03d57725ee64"
          rm -rf source/.git
          tar --sort=name --mtime='UTC 2026-08-22' --owner=0 --group=0 --numeric-owner -czf AIRenOS_R3-A1_bf274805_source.tar.gz source
          sha256sum AIRenOS_R3-A1_bf274805_source.tar.gz > AIRenOS_R3-A1_bf274805_SHA256SUMS.txt
          printf '%s\n' \
            'milestone=R3-A1' \
            'closure_commit=bf274805f2e6b0b3bfed4be40f9c03d57725ee64' \
            'closure_tree=b04dafcc0976addc29841659e6c27c20fa305ae6' \
            'foundation_base=2c40af819c93c32538ccd846b4e9eb7474cd5f74' \
            'archive_kind=exact_closure_source_snapshot' \
            > AIRenOS_R3-A1_bf274805_ARCHIVE_MANIFEST.txt
      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AIRenOS-R3-A1-bf274805-exact-source-snapshot
          path: |
            AIRenOS_R3-A1_bf274805_source.tar.gz
            AIRenOS_R3-A1_bf274805_SHA256SUMS.txt
            AIRenOS_R3-A1_bf274805_ARCHIVE_MANIFEST.txt
          if-no-files-found: error
