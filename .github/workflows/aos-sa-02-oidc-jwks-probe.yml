name: AOS-SA-02 OIDC Client Read-Only Probe

on:
  push:
    branches:
      - foundation/aos-sa-02-oidc-jwks-probe-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-client-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe staging OIDC discovery, JWKS, client redirect and PKCE
        shell: bash
        env:
          STAGING_BASE: https://airenos-keycloak-f26-staging.onrender.com
          REALM: airenos
          CLIENT_ID: airenos-browser-session
          REDIRECT_URI: https://session.airenos.com/oidc/callback
        run: |
          set -euo pipefail
          DISCOVERY="$STAGING_BASE/realms/$REALM/.well-known/openid-configuration"
          discovery_json="$(curl --fail --silent --show-error --location --max-time 20 "$DISCOVERY")"
          DISCOVERY_JSON="$discovery_json" node -e '
            const d=JSON.parse(process.env.DISCOVERY_JSON);
            const expectedBase=process.env.STAGING_BASE+"/realms/"+process.env.REALM;
            if (d.issuer !== expectedBase) throw new Error(`issuer mismatch: ${d.issuer}`);
            if (!d.jwks_uri || !d.authorization_endpoint) throw new Error("OIDC endpoints missing");
            if (!Array.isArray(d.response_types_supported) || !d.response_types_supported.includes("code")) throw new Error("authorization code response type missing");
            const methods=d.code_challenge_methods_supported || [];
            if (!methods.includes("S256")) throw new Error("PKCE S256 not advertised");
            console.log("issuer="+d.issuer);
            console.log("authorization_endpoint="+d.authorization_endpoint);
            console.log("pkce_s256_advertised=true");
          '
          jwks_uri="$(DISCOVERY_JSON="$discovery_json" node -e 'const d=JSON.parse(process.env.DISCOVERY_JSON); process.stdout.write(d.jwks_uri)')"
          jwks_json="$(curl --fail --silent --show-error --location --max-time 20 "$jwks_uri")"
          JWKS_JSON="$jwks_json" node -e '
            const j=JSON.parse(process.env.JWKS_JSON);
            const usable=(j.keys||[]).filter(k => k.kid && k.kty && (k.use === "sig" || !k.use));
            if (!usable.length) throw new Error("JWKS has no usable signing key");
            console.log("usable_signing_keys="+usable.length);
          '

          auth_endpoint="$(DISCOVERY_JSON="$discovery_json" node -e 'const d=JSON.parse(process.env.DISCOVERY_JSON); process.stdout.write(d.authorization_endpoint)')"
          challenge="$(printf 'aos-sa-02-governed-readonly-verifier-20260909' | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"

          valid_headers="$(mktemp)"
          valid_body="$(mktemp)"
          valid_status="$(curl --silent --show-error --max-time 20 --output "$valid_body" --dump-header "$valid_headers" --write-out '%{http_code}' --get "$auth_endpoint" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "redirect_uri=$REDIRECT_URI" \
            --data-urlencode "response_type=code" \
            --data-urlencode "scope=openid" \
            --data-urlencode "state=aos-sa-02-readonly" \
            --data-urlencode "nonce=aos-sa-02-readonly" \
            --data-urlencode "code_challenge=$challenge" \
            --data-urlencode "code_challenge_method=S256")"
          valid_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$valid_headers")"
          if [ "$valid_status" != "200" ] && [ "$valid_status" != "302" ]; then
            echo "Valid client+redirect+PKCE request rejected with HTTP $valid_status"
            exit 1
          fi
          case "$valid_location" in
            "$REDIRECT_URI"*)
              echo "Valid request unexpectedly redirected immediately to callback"
              exit 1
              ;;
          esac
          if [ "$valid_status" = "200" ]; then
            if ! grep -Eqi '<form|login|username|password|kc-form-login' "$valid_body"; then
              echo "HTTP 200 did not look like an authentication page"
              exit 1
            fi
          fi
          echo "client_redirect_pkce_valid_request=accepted_to_auth_flow"

          bad_headers="$(mktemp)"
          bad_body="$(mktemp)"
          bad_status="$(curl --silent --show-error --max-time 20 --output "$bad_body" --dump-header "$bad_headers" --write-out '%{http_code}' --get "$auth_endpoint" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "redirect_uri=https://invalid.example/aos-sa-02" \
            --data-urlencode "response_type=code" \
            --data-urlencode "scope=openid" \
            --data-urlencode "state=aos-sa-02-bad-redirect" \
            --data-urlencode "code_challenge=$challenge" \
            --data-urlencode "code_challenge_method=S256")"
          bad_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$bad_headers")"
          case "$bad_location" in
            https://invalid.example/*)
              echo "Invalid redirect URI was accepted"
              exit 1
              ;;
          esac
          if [ "$bad_status" = "200" ] && grep -Eqi '<form[^>]*action=.*login-actions/authenticate|kc-form-login' "$bad_body"; then
            echo "Invalid redirect URI unexpectedly reached authentication form"
            exit 1
          fi
          echo "invalid_redirect_not_accepted=true"
          echo "AOS-SA-02 client/redirect/PKCE read-only probe: PASS"
