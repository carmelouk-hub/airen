name: risto-mat-017-background-job-engine

on:
  push:
    branches:
      - "risto/mat-017-background-job-engine-runtime-20260910"

permissions:
  contents: read

jobs:
  background-job-engine-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify MAT-017 governed delta
        shell: bash
        run: |
          set -euo pipefail
          base="585d7018dcd9e7ce652abea914039b4483840fa1"
          git cat-file -e "${base}^{commit}"
          mapfile -t actual < <(git diff --name-only "$base" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            ".github/workflows/risto-mat-017-background-job-engine.yml" \
            "packages/runtime-jobs/src/background-job-engine.ts" \
            "tests/integration/risto-background-job-engine.test.ts" \
            "tests/postgres/risto-background-outbox-worker-runtime.test.ts" | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"

      - name: Install locked Node PostgreSQL dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply AIRenOS bootstrap and canonical migrations through MAT-016
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/bootstrap/0000_runtime_roles.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find db/migrations -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{4}_[A-Za-z0-9_.-]+\.sql' | sort)

      - name: Run MAT-015 provider-neutral dispatcher regression
        run: node --experimental-strip-types --test tests/integration/risto-outbox-delivery-recovery.test.ts

      - name: Run MAT-016 PostgreSQL outbox worker regression
        run: node --experimental-strip-types --test tests/postgres/risto-outbox-worker-runtime.test.ts

      - name: Run MAT-017 background job engine contract proof
        run: node --experimental-strip-types --test tests/integration/risto-background-job-engine.test.ts

      - name: Run MAT-017 PostgreSQL scheduled recovery proof
        run: node --experimental-strip-types --test tests/postgres/risto-background-outbox-worker-runtime.test.ts
