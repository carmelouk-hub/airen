name: r3-a-exact-closure-archive
on:
  push:
    branches:
      - "archive/r3-a-snapshot-20260822"
  pull_request:
    branches:
      - "foundation/**"

permissions:
  contents: read

jobs:
  package-exact-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified closure commit
        uses: actions/checkout@v4
        with:
          ref: 6ffdc757c6f1b5249bb2ffcef832d7daa179bee5
          path: source
          fetch-depth: 1
      - name: Verify exact source state and create deterministic recovery package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "6ffdc757c6f1b5249bb2ffcef832d7daa179bee5"
          rm -rf source/.git
          tar --sort=name --mtime='UTC 2026-08-22' --owner=0 --group=0 --numeric-owner -czf AIRenOS_R3-A_6ffdc757_source.tar.gz source
          sha256sum AIRenOS_R3-A_6ffdc757_source.tar.gz > AIRenOS_R3-A_6ffdc757_SHA256SUMS.txt
          printf '%s\n' \
            'milestone=R3-A' \
            'closure_commit=6ffdc757c6f1b5249bb2ffcef832d7daa179bee5' \
            'closure_tree=b049ba35d765e80cbbfe9b6968aa185ca8471240' \
            'foundation_base=2c40af819c93c32538ccd846b4e9eb7474cd5f74' \
            'r3_a1_closure=bf274805f2e6b0b3bfed4be40f9c03d57725ee64' \
            'exact_closure_ci_run=32586246711' \
            'archive_kind=exact_closure_source_snapshot' \
            > AIRenOS_R3-A_6ffdc757_ARCHIVE_MANIFEST.txt
      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AIRenOS-R3-A-6ffdc757-exact-source-snapshot
          path: |
            AIRenOS_R3-A_6ffdc757_source.tar.gz
            AIRenOS_R3-A_6ffdc757_SHA256SUMS.txt
            AIRenOS_R3-A_6ffdc757_ARCHIVE_MANIFEST.txt
          if-no-files-found: error
