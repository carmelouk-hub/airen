name: airenos-identity-session-authority-foundation
on:
  push:
    branches: ["foundation/airenos-identity-session-authority-**"]
  workflow_dispatch:
jobs:
  isa-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - run: npm run check:boundaries
      - run: npm run check:machine-context
      - run: npm run check:foundation-contracts
      - run: npm run test:identity-adapter
      - run: node --experimental-strip-types --test tests/integration/airenos-identity-session-authority.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-session-lifecycle.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-oidc-upstream-provider.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-keycloak-infrastructure-contract.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-ovh-milan-provisioning-contract.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-ovh-milan-live-preflight-contract.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-identity-staging-security-promotion-contract.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-session-signing-key-lifecycle-contract.test.ts
      - run: node --experimental-strip-types --test tests/integration/airenos-identity-render-staging-contract.test.ts

  isa-f23-render-container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build F2.3 Session Authority staging image
        run: docker build -f deploy/Dockerfile.session-authority -t airenos-session-authority-f23:${GITHUB_SHA} .
      - name: Verify F2.3 image contract label
        run: test "$(docker image inspect airenos-session-authority-f23:${GITHUB_SHA} --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "f2.3"
      - name: Verify F2.3 image keeps non-root runtime user
        run: test "$(docker image inspect airenos-session-authority-f23:${GITHUB_SHA} --format '{{ .Config.User }}')" = "node"

  isa-f2-keycloak-image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned optimized AIRenOS Keycloak image
        run: docker build -f deploy/keycloak/Containerfile -t airenos-keycloak-contract:${GITHUB_SHA} .
      - name: Verify governed Keycloak image version label
        run: test "$(docker image inspect airenos-keycloak-contract:${GITHUB_SHA} --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "26.7.2"
      - name: Verify Keycloak binary from exact built image
        run: docker run --rm airenos-keycloak-contract:${GITHUB_SHA} --version

  isa-f2-ovh-milan-terraform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Check Terraform formatting
        run: terraform -chdir=infra/ovh/milan-staging fmt -check -recursive
      - name: Initialize exact OVH provider without backend or credentials
        run: terraform -chdir=infra/ovh/milan-staging init -backend=false -input=false
      - name: Validate OVH Milan provisioning contract only
        run: terraform -chdir=infra/ovh/milan-staging validate
      - name: Initialize read-only OVH provider preflight without credentials
        run: terraform -chdir=infra/ovh/milan-staging/preflight init -backend=false -input=false
      - name: Validate read-only provider preflight contract only
        run: terraform -chdir=infra/ovh/milan-staging/preflight validate

  isa-f1-postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airen_isa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d airen_isa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/airen_isa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/run-postgres-runtime-tests.sh
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0035_airenos_session_lifecycle.sql
      - run: node --experimental-strip-types --test tests/postgres/airenos-session-lifecycle-runtime.test.ts
