databases:
  - name: ristoairen-rbl01c2-db
    plan: free
    region: frankfurt
    databaseName: airen_rbl01c2
    user: airen_rbl01c2

services:
  - type: web
    name: ristoairen-booking-rbl01c2-20260827
    runtime: docker
    plan: starter
    region: frankfurt
    branch: rbl/ristoairen-real-baseline-01-20260827
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    preDeployCommand: node --experimental-strip-types deploy/migrate-ristoairen-booking.ts
    envVars:
      - key: NODE_ENV
        value: test
      - key: APP_BASE_DOMAIN
        value: ristoairen.test
      - key: AUTH_ADAPTER
        value: ed25519-signed-session
      - key: AUTH_PROVIDER_KEY
        value: base44-rbl01c2
      - key: AUTH_AUDIENCE
        value: airenos-foundation
      - key: AUTH_SESSION_PUBLIC_KEYS_JSON
        value: '{"base44-user-20260828-k1":{"key":{"crv":"Ed25519","x":"S3Vniu5dCC2vFW3Sx84df7OGsL1X5Mlf7z1m98MA_fI","kty":"OKP"},"enabled":true}}'
      - key: SECRET_MANAGER_ADAPTER
        value: env
      - fromGroup: rbl01c2-postgres-private
      - key: RBL01C2_RUNTIME_DB_SEED
        generateValue: true
      - key: RBL01C2_RUNTIME_DB_HOST
        value: ristoairen-postgres-rbl01c2
      - key: RBL01C2_RUNTIME_DB_PORT
        value: "5432"
      - key: RBL01C2_RUNTIME_DB_NAME
        fromService:
          type: pserv
          name: ristoairen-postgres-rbl01c2
          envVarKey: POSTGRES_DB
      - key: RBL01C2_RUNTIME_DB_USER
        value: airen_runtime
      - key: DATABASE_URL_SECRET_REF
        value: secret://env/RBL01C2_RUNTIME_DATABASE_URL
      - key: RBL01C2_AUTH_SESSION_KEY
        generateValue: true
      - key: AUTH_SESSION_KEY_SECRET_REF
        value: secret://env/RBL01C2_AUTH_SESSION_KEY
      - key: MIGRATION_SECRET_MANAGER_ADAPTER
        value: env
      - key: MIGRATION_DATABASE_URL_SECRET_REF
        value: secret://env/RBL01C2_DATABASE_URL
      - key: AIREN_RUNTIME_ROLE_PROVISIONING_MODE
        value: bootstrap
      - key: RBL01C2_BOOKING_CURSOR_KEY
        generateValue: true
      - key: RISTOAIREN_BOOKING_CURSOR_HMAC_KEY_SECRET_REF
        value: secret://env/RBL01C2_BOOKING_CURSOR_KEY
      - key: RISTOAIREN_BOOKING_REQUIRED_ENTITLEMENT
        value: rbl01c2.booking.external
      - key: RISTOAIREN_BOOKING_SERVICE_PUBLIC_KEYS_JSON
        value: '{"base44-service-20260828-k1":{"key":{"crv":"Ed25519","x":"e_20uQ9zRm7gvO15-RgfKZ1ShAayXz4wBC5ImfPFghg","kty":"OKP"},"enabled":true}}'
      - key: RBL01D_BASE44_SEED_ENABLED
        value: "true"
      - key: RISTOAIREN_BOOKING_ADAPTER_ENABLED
        value: "true"
      - key: RISTOAIREN_BOOKING_PROJECTION_ENABLED
        value: "true"
      - key: RISTOAIREN_BOOKING_MUTATION_ENABLED
        value: "false"
      - key: HOST
        value: 0.0.0.0
