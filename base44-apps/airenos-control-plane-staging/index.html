<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/carmelouk-hub/airen/cd9b3db1de61f3898f835078a8fe9af991a62060/base44-apps/airenos-control-plane-staging/public/airenos-icon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030814" />
    <meta name="description" content="AIRenOS Control Plane staging shell" />
    <title>AIRenOS · Control Plane</title>
    <style>
      .architecture-launcher {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 40;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 10px 13px;
        border: 1px solid rgba(79, 216, 255, .28);
        border-radius: 12px;
        background: rgba(4, 19, 33, .94);
        color: #dff7ff;
        box-shadow: 0 12px 35px rgba(0, 0, 0, .32);
        text-decoration: none;
        font: 600 11px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        backdrop-filter: blur(14px);
      }
      .architecture-launcher:hover {
        border-color: rgba(79, 216, 255, .55);
        background: rgba(7, 37, 55, .98);
      }
      .architecture-launcher small {
        padding: 4px 6px;
        border-radius: 999px;
        background: rgba(24, 113, 143, .24);
        color: #64dcff;
        font-size: 8px;
        letter-spacing: .08em;
      }
      @media (max-width: 760px) {
        .architecture-launcher {
          right: 14px;
          bottom: 14px;
          padding: 9px 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="architecture-launcher" href="/architecture-explorer.html" aria-label="Open AIRenOS Architecture Explorer">
      Architecture Explorer <small>READ ONLY</small>
    </a>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
